<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffaf2" />
    <meta name="description" content="ホットクックのレシピを選び、1週間の献立と買い物リストをまとめるアプリ" />
    <title>きょうのこんだて</title>
    <link rel="manifest" href="/cookbook-menu-planner/manifest.webmanifest?v=20260908" />
    <link rel="icon" type="image/png" sizes="192x192" href="/cookbook-menu-planner/assets/cookbook-menu-planner-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/cookbook-menu-planner/assets/cookbook-menu-planner-apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20260908-2" />
    <script src="./supabase-config.js"></script>
    <script defer src="./hotcook-recipes.js?v=20260908-1"></script>
    <script defer src="./app.js?v=20260908-2"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <button id="menuButton" class="icon-button menu-button" type="button" aria-label="アカウントメニューを開く" aria-controls="appMenu" aria-expanded="false"><span class="hamburger" aria-hidden="true"></span></button>
        <button class="brand" type="button" data-view-link="home" aria-label="メインページへ"><span class="brand-mark">⌂</span><span>きょうのこんだて</span></button>
        <nav class="desktop-nav" aria-label="メインナビゲーション">
          <button class="nav-button active" type="button" data-view-link="home">メニュー</button>
          <button class="nav-button" type="button" data-view-link="week">1週間メニュー</button>
          <button class="nav-button" type="button" data-view-link="shopping">買い物</button>
        </nav>
        <span id="storageBadge" class="storage-badge">Local</span>
      </div>
    </header>

    <div id="menuOverlay" class="menu-overlay hidden"></div>
    <aside id="appMenu" class="account-drawer hidden" aria-hidden="true">
      <div class="drawer-header">
        <div><span class="eyebrow">アカウント</span><strong id="menuUserName">未ログイン</strong></div>
        <button id="menuCloseButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <p id="menuStatus" class="drawer-message"></p>
      <form id="profileForm" class="drawer-form hidden">
        <label>ユーザー名<input id="displayNameInput" type="text" autocomplete="username" maxlength="40" required /></label>
        <label>新しいパスワード<input id="newPasswordInput" type="password" autocomplete="new-password" placeholder="変更しない場合は空欄" /></label>
        <button class="secondary-button" type="submit">設定を保存</button>
      </form>
      <button id="syncButton" class="secondary-button" type="button">最新データを読み込む</button>
      <button id="signOutButton" class="secondary-button hidden" type="button">ログアウト</button>
    </aside>

    <main class="page-shell">
      <section id="authPanel" class="auth-card hidden">
        <div><span class="eyebrow">MEMBERS ONLY</span><h1>ログイン</h1><p>登録済みのユーザー名とパスワードを入力してください。</p></div>
        <form id="authForm" class="auth-form">
          <label>ユーザー名<input id="usernameInput" type="text" autocomplete="username" maxlength="40" required /></label>
          <label>パスワード<input id="passwordInput" type="password" autocomplete="current-password" required /></label>
          <button class="primary-button" type="submit">ログイン</button>
          <span id="authBadge" class="form-message" aria-live="polite"></span>
        </form>
      </section>

      <div id="appContent">
        <section class="app-view" data-view="home">
          <div class="page-intro">
            <div><span class="eyebrow">HOTCOOK RECIPE BOOK</span><h1>今週、何をつくる？</h1><p>日付と食種を選んで、1週間のメニューに追加できます。</p></div>
            <button id="scheduleSelectionButton" class="primary-button" type="button" disabled>1週間メニューに追加</button>
          </div>
          <div id="genreContainer" class="genre-container"></div>
        </section>

        <section class="app-view hidden" data-view="week">
          <div class="view-heading">
            <div><span class="eyebrow">WEEKLY MENU</span><h1>1週間メニュー</h1><p id="weekRange"></p></div>
            <div class="week-controls"><button id="prevWeekButton" class="icon-button" type="button" aria-label="前の週">‹</button><button id="currentWeekButton" class="secondary-button" type="button">今週</button><button id="nextWeekButton" class="icon-button" type="button" aria-label="次の週">›</button></div>
          </div>
          <div id="weeklyGrid" class="weekly-grid"></div>
        </section>

        <section class="app-view hidden" data-view="shopping">
          <div class="view-heading shopping-heading">
            <div><span class="eyebrow">SHOPPING LIST</span><h1>買い物リスト</h1><p id="shoppingWeekRange"></p></div>
            <div class="shopping-heading-actions">
              <div class="week-controls"><button id="prevShoppingWeekButton" class="icon-button" type="button" aria-label="前の週">‹</button><button id="currentShoppingWeekButton" class="secondary-button" type="button">今週</button><button id="nextShoppingWeekButton" class="icon-button" type="button" aria-label="次の週">›</button></div>
              <div class="shopping-progress"><strong id="shoppingProgress">0 / 0</strong><span>チェック済み</span></div>
            </div>
          </div>
          <div id="shoppingList" class="shopping-list"></div>
        </section>
      </div>
    </main>

    <nav class="mobile-nav" aria-label="メインナビゲーション">
      <button class="mobile-nav-button active" type="button" data-view-link="home"><span>⌂</span>メニュー</button>
      <button class="mobile-nav-button" type="button" data-view-link="week"><span>▦</span>1週間</button>
      <button class="mobile-nav-button" type="button" data-view-link="shopping"><span>✓</span>買い物</button>
    </nav>

    <dialog id="recipeDialog" class="recipe-dialog">
      <button id="closeRecipeDialog" class="dialog-close" type="button" aria-label="閉じる">×</button>
      <img id="dialogRecipeImage" class="dialog-hero" alt="" />
      <div class="dialog-body">
        <span id="dialogRecipeGenre" class="genre-pill"></span><h2 id="dialogRecipeTitle"></h2><p id="dialogRecipeMeta" class="dialog-meta"></p>
        <div class="recipe-detail-grid">
          <section><h3>材料</h3><div id="dialogIngredients" class="ingredient-list"></div></section>
          <section><h3>作り方</h3><ol id="dialogSteps" class="step-list"></ol></section>
        </div>
        <button id="dialogSelectButton" class="primary-button wide-button" type="button">このメニューの日付を選ぶ</button>
      </div>
    </dialog>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </body>
</html>
